services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hersvin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hersvin_dev}
      POSTGRES_DB: hersvin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hersvin"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"

volumes:
  pgdata:
  minio-data:
